# Include dentro do bloco http {} (ex: /etc/nginx/conf.d/allandev-http.conf).
# Sem CDN na frente: $binary_remote_addr já é o IP real do cliente.
limit_req_zone $binary_remote_addr zone=allandev_contact:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=allandev_images:2m rate=30r/s;
limit_req_zone $binary_remote_addr zone=allandev_general:5m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=allandev_conn:5m;
