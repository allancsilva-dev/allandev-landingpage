# Include dentro do server TLS de allandev.nexostech.com.br (ver allandev-site.conf).
server_tokens off;
limit_req_status 429;
limit_conn_status 429;
client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;
limit_conn allandev_conn 30;
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_hide_header X-Powered-By;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location = /api/health { return 404; }
location = /api/contact {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    limit_req zone=allandev_contact burst=5 nodelay;
    proxy_pass http://127.0.0.1:4000;
}
location /_next/image {
    limit_req zone=allandev_images burst=60 nodelay;
    proxy_pass http://127.0.0.1:4000;
}
location /_next/static/ {
    proxy_pass http://127.0.0.1:4000;
}
location / {
    limit_req zone=allandev_general burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000;
}
