# /etc/nginx/sites-available/allandev.conf  (link em sites-enabled)
# Certificado: sudo certbot certonly --nginx -d allandev.nexostech.com.br

server {
    listen 80;
    listen [::]:80;
    server_name allandev.nexostech.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name allandev.nexostech.com.br;

    ssl_certificate     /etc/letsencrypt/live/allandev.nexostech.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allandev.nexostech.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:allandev_ssl:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/allandev-server.conf;
}

# Catch-all: acesso por IP ou Host desconhecido fecha a conexão sem responder.
